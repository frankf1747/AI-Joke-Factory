[build]
  # Build from the repo root (where package.json + Vite live), NOT the stale
  # frontend/ folder. This overrides any "Base directory" set in the Netlify UI.
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

  # ---- LIVE against the real backend (2026-09-14) ----
  #
  # This block is what production uses. [build.environment] overrides .env.local
  # for the Netlify build, so these two lines — not .env.local — decide what the
  # deployed app talks to.
  #
  # The Azure Container App is running the phase-3B backend: /marketing/.../split
  # and /unsplit exist, raw_text submissions parse, and migration 0002 (the
  # batches.raw_text columns) is applied. Verified before this was flipped.
  #
  # To go back to the offline demo — no backend, in-browser mock, DEV
  # role-switcher visible — set VITE_USE_MOCK_API back to "true".
  #
  # If the app breaks after a backend deploy, check this first:
  #   curl -s -o /dev/null -w "%{http_code}\n" -X POST \
  #     -H 'Content-Type: application/json' -d '{"jokes":["a"]}' \
  #     "$VITE_API_BASE_URL/v1/marketing/batches/1/split"
  # 404 means the backend rolled back to a pre-3B image and the Joke Maker's
  # submit and Marketing's split will both be broken.
  VITE_USE_MOCK_API = "false"
  VITE_API_BASE_URL = "https://jokefactory-api.whitepebble-2daa4226.westus2.azurecontainerapps.io"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

