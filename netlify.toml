[build]
  # Build from the repo root (where package.json + Vite live), NOT the stale
  # frontend/ folder. This overrides any "Base directory" set in the Netlify UI.
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

  # ---- GOING LIVE: flip ONE value, VITE_USE_MOCK_API, to "false" ----
  #
  # This block is what production actually uses. [build.environment] overrides
  # .env.local for the Netlify build, so these two lines — not .env.local —
  # decide what the deployed app talks to.
  #
  # The API URL below is the real Azure Container App and is correct.
  #
  # DO NOT flip VITE_USE_MOCK_API to "false" until the backend running there has
  # the phase-3B changes (raw_text + split/unsplit). As of 2026-09-14 it does
  # NOT: it still rejects a raw_text submission with 400 "invalid payload" and
  # 404s on /split. Pointing the app at it in that state breaks the core
  # workflow — the Joke Maker cannot submit and Marketing cannot split.
  #
  # One-line readiness check (404 = not deployed yet, anything else = ready):
  #   curl -s -o /dev/null -w "%{http_code}\n" -X POST \
  #     -H 'Content-Type: application/json' -d '{"jokes":["a"]}' \
  #     "$VITE_API_BASE_URL/v1/marketing/batches/1/split"
  #
  # Also confirm APP_LLM_BASE_URL and APP_LLM_API_KEY are set on the Container
  # App. Without them the backend silently uses the STUB classifier, which
  # scores every joke identically — the game will appear to work while the
  # whole reverse-engineering exercise is meaningless.
  #
  # While this stays "true" the app runs entirely on the in-browser mock with
  # the DEV role-switcher visible, which is a fine reviewer demo.
  VITE_USE_MOCK_API = "true"
  VITE_API_BASE_URL = "https://jokefactory-api.whitepebble-2daa4226.westus2.azurecontainerapps.io"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

