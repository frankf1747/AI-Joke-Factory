<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zhong Hua Shi Fu Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Noto+Serif+SC:wght@300;400;600;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --mw:148.5mm; --mh:210mm;   /* one menu: A5 by default, half-letter with ?size=letter */
    --ink:#2a2420;
    --ink-soft:#3b332d;
    --brown:#7a6452;
    --muted:#7a6856;
    --rule:#b5a48d;
    --cinnabar:#b23a28;
    --paper:#ffffff;
  }
  @page { size: 297mm 210mm; margin: 0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#d6d3ce; }
  body{ font-family:"Noto Serif SC", serif; color:var(--ink); -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  /* ---------- sheet: A4 landscape holding two A5 menus ---------- */
  .sheet{ width:calc(var(--mw) * 2); height:var(--mh); display:flex; position:relative; background:var(--paper); }
  .sheet.single{ width:var(--mw); }
  .cut{ position:absolute; z-index:10; left:var(--mw); top:0; bottom:0; width:0; border-left:.2mm dashed rgba(90,75,60,.28); }
  .cut::before,.cut::after{ content:"✂"; position:absolute; left:-1.6mm; font-size:3mm; color:rgba(90,75,60,.4); }
  .cut::before{ top:1.5mm } .cut::after{ bottom:1.5mm; transform:rotate(180deg) }

  /* ---------- one menu (A5) ---------- */
  .menu{
    width:var(--mw); height:var(--mh); position:relative; overflow:hidden;
    background:url(paper.jpg) center/cover no-repeat;
    padding:11mm 10.5mm 9mm 10.5mm;
  }
  .frame{ position:absolute; inset:5mm; border:.28mm solid rgba(122,100,82,.7); pointer-events:none; }
  .frame::after{ content:""; position:absolute; inset:.9mm; border:.18mm solid rgba(122,100,82,.45); }

  /* decorative ink art */
  .art{ position:absolute; pointer-events:none; }
  .sun{ right:7.5mm; top:7.5mm; width:25mm; height:25mm; border-radius:50%;
        background:#c4513a;
        filter:url(#rough); }
  .mountains{ left:30mm; right:6.3mm; bottom:6.3mm; height:46mm; }

  /* ---------- header ---------- */
  header{ position:relative; height:47mm; }
  .badge{ position:absolute; left:0; top:-1mm; width:25mm; height:25mm; }
  .badge text{ font-family:"Cormorant Garamond", serif; font-size:6.3px; letter-spacing:1.05px; fill:var(--brown); }
  .badge .zh{ font-family:"Noto Serif SC"; font-size:5.2px; letter-spacing:1.4px; }
  .badge .core{ font-family:"Ma Shan Zheng"; font-size:11px; fill:var(--cinnabar); }

  .logo{ position:absolute; right:3mm; top:-.5mm; width:40mm; height:44.8mm; z-index:2; overflow:visible; }
  .sub{
    position:absolute; right:45.5mm; top:1.5mm;
    writing-mode:vertical-rl; font-size:2.65mm; letter-spacing:1.1mm; color:var(--brown);
    font-weight:600; border-right:.2mm solid var(--rule); padding-right:1.2mm;
  }
  .seal{ position:absolute; right:45mm; top:37mm; width:7.6mm; height:7.6mm; z-index:3; }

  .intro{ position:absolute; left:0; top:27mm; width:58mm; }
  .intro .en{ font-family:"Cormorant Garamond", serif; font-style:italic; font-size:3.4mm; color:var(--brown); letter-spacing:.3mm; }
  .intro .en b{ font-style:normal; font-weight:500; letter-spacing:.9mm; font-size:2.5mm; display:block; margin-bottom:.8mm; color:var(--muted); }
  .intro p{ font-size:2.35mm; line-height:1.75; color:var(--ink-soft); margin-top:1.6mm; font-weight:400; letter-spacing:.15mm; }

  /* ---------- sections ---------- */
  section{ position:relative; display:grid; grid-template-columns:8mm 1fr; column-gap:2.2mm; margin-top:var(--sec-gap, 4.2mm); }
  .label{ display:flex; flex-direction:column; align-items:center; padding-top:.4mm; }
  .label .no{ font-family:"Zhi Mang Xing"; font-size:5mm; color:var(--cinnabar); line-height:1; }
  .label .cat{ writing-mode:vertical-rl; font-size:2.9mm; letter-spacing:1.4mm; font-weight:600; color:var(--ink); margin-top:1.4mm; }
  .label .poet{ writing-mode:vertical-rl; font-size:2.1mm; letter-spacing:.7mm; color:var(--muted); margin-top:1.2mm; }
  .label .line{ flex:1; width:.15mm; background:linear-gradient(var(--rule),transparent); margin-top:1.4mm; min-height:4mm; }

  .dishes{ display:grid; column-gap:5mm; row-gap:3.1mm; }
  .cold .dishes{ grid-template-columns:repeat(3,1fr); column-gap:4mm; }
  .hot  .dishes{ grid-template-columns:1fr 1fr; }
  .sweet .dishes{ grid-template-columns:1fr 1fr; }

  .dish h3{ font-family:"Ma Shan Zheng", cursive; font-weight:400; font-size:5.3mm; line-height:1.05; color:var(--ink); letter-spacing:.3mm; display:flex; align-items:baseline; gap:1.4mm; }
  .dish h3 i{ font-style:normal; width:1.3mm; height:1.3mm; background:var(--cinnabar); border-radius:50%; flex:none; transform:translateY(-.9mm); opacity:.85; }
  .dish .real{ font-size:2.25mm; font-weight:600; color:var(--brown); letter-spacing:.5mm; margin-top:.9mm; }
  .dish p{ font-size:2.22mm; line-height:1.68; color:var(--ink-soft); margin-top:.9mm; font-weight:400; text-align:left; letter-spacing:.06mm; }
  .dish p .w, .intro p .w{ white-space:nowrap; }
  .dish p, .intro p{ text-wrap:pretty; }
  .dish p em{ font-style:normal; color:var(--ink); font-weight:400; }

  .hot .dishes{ position:relative; }
  .hot .dishes::before{ content:""; position:absolute; left:50%; top:1mm; bottom:1mm; width:.12mm; background:rgba(160,140,115,.7); transform:translateX(-50%); }

  .sweet .note{ align-self:end; text-align:right; }
  .sweet .note .poem{ font-family:"Zhi Mang Xing", cursive; font-size:4.6mm; color:var(--ink); line-height:1.25; letter-spacing:.3mm; }
  .sweet .note .poem small{ display:block; font-family:"Noto Serif SC"; font-size:2.1mm; color:var(--muted); letter-spacing:.6mm; margin-top:1mm; }

  footer{ position:absolute; left:10.5mm; right:10.5mm; bottom:8.2mm; display:flex; justify-content:space-between; align-items:center;
          font-size:1.95mm; letter-spacing:.55mm; color:var(--muted); }
  footer .en{ font-family:"Cormorant Garamond"; letter-spacing:.7mm; font-size:2.3mm; }
  footer .dot{ color:var(--cinnabar); }

  @media screen{
    body{ padding:10mm; display:flex; flex-direction:column; align-items:center; gap:10mm; }
    .sheet{ box-shadow:0 2mm 8mm rgba(0,0,0,.18); }
  }
  @media print{ body{ background:none; } }
  /* ---------- English edition ---------- */
  .badge .zh.en{ font-family:"Cormorant Garamond"; font-size:5.6px; letter-spacing:1.6px; font-weight:600; }
  .sub{ font-family:"Cormorant Garamond", serif; font-size:2.35mm; letter-spacing:.75mm; font-weight:600; }
  .intro p{ font-family:"EB Garamond", serif; font-style:italic; font-size:2.85mm; line-height:1.5; letter-spacing:.05mm; }
  .label .cat{ font-family:"Cormorant Garamond", serif; text-transform:uppercase; font-size:2.6mm; letter-spacing:.7mm; }
  .label .poet{ font-family:"Cormorant Garamond", serif; font-style:italic; font-size:2.5mm; letter-spacing:.15mm; }
  .dish .kick{ font-family:"Ma Shan Zheng", cursive; font-size:3.05mm; line-height:1; color:var(--cinnabar); letter-spacing:.35mm; display:flex; align-items:center; gap:1.2mm; }
  .dish .kick i{ width:1.1mm; height:1.1mm; background:var(--cinnabar); border-radius:50%; opacity:.85; }
  .dish h3{ font-family:"Cormorant Garamond", serif; font-style:italic; font-weight:600; font-size:4.1mm; line-height:1.08; letter-spacing:0; display:block; margin-top:.9mm; }
  .dish .real{ font-family:"Cormorant Garamond", serif; text-transform:uppercase; font-size:2.2mm; letter-spacing:.32mm; margin-top:.8mm; }
  .dish p{ font-family:"EB Garamond", serif; font-size:2.48mm; line-height:1.38; letter-spacing:0; margin-top:.7mm; hyphens:manual; }
  .dish p em{ font-style:italic; }
  .dish h3, .dish p{ text-wrap:pretty; }
  .sweet .note .poem{ font-family:"Cormorant Garamond", serif; font-style:italic; font-weight:600; font-size:3.7mm; line-height:1.25; letter-spacing:0; }
  .sweet .note .poem small{ font-family:"Cormorant Garamond", serif; font-style:normal; font-size:2.3mm; letter-spacing:.2mm; }
  .dishes{ row-gap:2.6mm; }
  /* English: horizontal section headings, full-width dish grid */
  section{ display:block; margin-top:var(--sec-gap-en, 3.6mm); }
  .label{ flex-direction:row; align-items:baseline; gap:2mm; padding-top:0; margin-bottom:2.2mm; }
  .label .no{ font-size:4.6mm; }
  .label .cat{ writing-mode:horizontal-tb; margin-top:0; font-size:2.75mm; letter-spacing:.9mm; }
  .label .poet{ writing-mode:horizontal-tb; margin-top:0; font-size:2.9mm; }
  .label .line{ height:.15mm; width:auto; min-height:0; margin-top:0; align-self:center; background:linear-gradient(90deg,var(--rule),transparent); }
  .cold .dishes{ column-gap:5mm; }
  header{ height:43mm; }
  .logo{ width:37mm; height:41.4mm; }
  .sub{ right:42.5mm; }
  .seal{ right:42mm; top:33.5mm; }
  .sun{ width:23mm; height:23mm; right:8mm; top:7mm; }
  .intro{ top:25mm; }
  .nw{ white-space:nowrap; }
  .badge{ width:21.5mm; height:21.5mm; top:-1.5mm; }
  /* English: final fit */
  header{ height:40mm; }
  .logo{ width:35mm; height:39.2mm; }
  .sub{ right:40.5mm; }
  .seal{ right:40mm; top:31mm; width:7mm; height:7mm; }
  .sun{ width:21.5mm; height:21.5mm; }
  .intro{ top:22mm; }
  .dish .kick{ font-size:2.75mm; }
  .dish h3{ font-size:3.85mm; margin-top:.6mm; }
  .dish .real{ margin-top:.6mm; }
  .dish p{ line-height:1.34; margin-top:.5mm; }
  .dishes{ row-gap:2.3mm; }
  .label{ margin-bottom:1.8mm; }
</style>
</head>

<template id="menu-tpl">
  <article class="menu">
    <div class="frame"></div>
    <div class="art sun"></div>
    <svg class="art mountains" viewBox="0 0 560 240" preserveAspectRatio="none"><use href="#mtn"/></svg>

    <header>
      <svg class="badge" viewBox="0 0 100 100">
        <text><textPath href="#ring" startOffset="0" textLength="224" lengthAdjust="spacing">ZHONG HUA SHI FU · CHINESE BISTRO · </textPath></text>
        <circle cx="50" cy="50" r="27" fill="none" stroke="#b5a48d" stroke-width=".5" stroke-dasharray="1 1.6"/>
        <text class="core" x="50" y="47" text-anchor="middle">食</text>
        <text class="zh en" x="50" y="60" text-anchor="middle" fill="#8d7b68">BISTRO</text>
      </svg>

      <div class="intro">
        <div class="en"><b>MENU</b>A table of small poems.</div>
        <p>Every grain has a story;<br>every bite, a kindred spirit.</p>
      </div>

      <svg class="logo" viewBox="60 30 1680 1880" aria-label="中华食付">
        <g fill="#1c1714" filter="url(#inkedge)">
          <use href="#nz" transform="translate(-50 -35) scale(1.09)"/><use href="#nh" x="700" y="-10"/>
          <use href="#ns" x="0" y="880"/><use href="#nf" x="820" y="900"/>
        </g>
      </svg>
      <div class="sub">FOUR SEASONS</div>
      <svg class="seal"><use href="#sealsym"/></svg>
    </header>

    <section class="cold">
      <div class="label"><span class="no">壹</span><span class="cat">Cold</span><span class="poet">the overture</span><span class="line"></span></div>
      <div class="dishes">
        <div class="dish">
          <div class="kick"><i></i>梅子黄时</div>
          <h3>Plum Rain</h3>
          <div class="real">Sour-Plum Tomatoes</div>
          <p>Peeled tomatoes steeped overnight in chilled <span class="nw">sour-plum</span> syrup. Tart, then sweet, like <em>a soft rain in Jiangnan</em>.</p>
        </div>
        <div class="dish">
          <div class="kick"><i></i>锦官卤韵</div>
          <h3>Echoes of Chengdu</h3>
          <div class="real">Sichuan Cold Platter</div>
          <p>Tripe, chicken feet, gizzards, radish and tofu, steeped in a red master stock. <em>Numbing, fiery, fragrant.</em></p>
        </div>
        <div class="dish">
          <div class="kick"><i></i>青麻踏浪</div>
          <h3>Pepper on the Waves</h3>
          <div class="real">Peppercorn Prawns</div>
          <p><span class="nw">Ice-chilled</span> prawns under crushed green peppercorn and sizzling oil&nbsp;— <em>a&nbsp;light tingle</em>, a clean sweetness.</p>
        </div>
      </div>
    </section>

    <section class="hot">
      <div class="label"><span class="no">贰</span><span class="cat">Hot</span><span class="poet">the main chapter</span><span class="line"></span></div>
      <div class="dishes">
        <div class="dish">
          <div class="kick"><i></i>春山拾翠</div>
          <h3>Spring Hills in Green</h3>
          <div class="real">Morels &amp; Asparagus</div>
          <p>Honeycomb morels that hold every drop of sauce, asparagus crisp as young bamboo&nbsp;— <em>a plate of mountain spring</em>.</p>
        </div>
        <div class="dish">
          <div class="kick"><i></i>黔火宫灯</div>
          <h3>Lanterns &amp; Mountain Fire</h3>
          <div class="real">Kung Pao Prawns · Guizhou Chili</div>
          <p>Golden prawns in a <span class="nw">lychee-style</span> <em><span class="nw">sweet-and-sour</span> glaze</em> over smoky Guizhou toasted chili. Half palace, half mountain.</p>
        </div>
        <div class="dish">
          <div class="kick"><i></i>文火流年</div>
          <h3>Slow Fire, Passing Years</h3>
          <div class="real">Slow-Braised Beef · Pearl Barley</div>
          <p>Beef braised low and slow until it <em>yields to the chopsticks</em>, over pearl barley that drinks in every drop.</p>
        </div>
        <div class="dish">
          <div class="kick"><i></i>炭火南风</div>
          <h3>Charcoal &amp; Southern Wind</h3>
          <div class="real">Beef &amp; Pineapple Skewers</div>
          <p>Threaded together and kissed by charcoal; the fruit’s bright tang melts the richness&nbsp;— <em>a warm tropical breeze</em>.</p>
        </div>
        <div class="dish">
          <div class="kick"><i></i>听取蛙声</div>
          <h3>Listening to the Frogs</h3>
          <div class="real">Bullfrog · Purple Perilla</div>
          <p>“Amid rice blossoms, the frogs sing of harvest.” Tender <span class="nw">wok-fried</span> bullfrog, <em>wild with peppery perilla</em>.</p>
        </div>
        <div class="dish">
          <div class="kick"><i></i>茅香雪花</div>
          <h3>Lemongrass &amp; Snowflakes</h3>
          <div class="real">Lemongrass Pork Jowl</div>
          <p>A prized cut, marbled like falling snow. <span class="nw">Lemongrass-marinated</span> and grilled&nbsp;— <em>crisp, juicy</em>, softly citrus.</p>
        </div>
        <div class="dish">
          <div class="kick"><i></i>但爱鲈鱼</div>
          <h3>For the Love of Sea Bass</h3>
          <div class="real">Sea Bass · Fire-Roasted Chili</div>
          <p>“All who travel the river love the sea bass.” Silken fish under blistered green chili&nbsp;— <em>smoky, spicy, honest</em>.</p>
        </div>
        <div class="dish">
          <div class="kick"><i></i>金甲卧云</div>
          <h3>Golden Armor on a Cloud</h3>
          <div class="real">Crispy Chicken · Corn-Potato Purée</div>
          <p>Golden, crackling skin on a cloud of sweet corn and potato purée. <em>Crisp outside, tender within</em>.</p>
        </div>
      </div>
    </section>

    <section class="sweet">
      <div class="label"><span class="no">叁</span><span class="cat">Sweet</span><span class="poet">the coda</span><span class="line"></span></div>
      <div class="dishes">
        <div class="dish">
          <div class="kick"><i></i>围炉夜话</div>
          <h3>Fireside Tales</h3>
          <div class="real">Sweet Potato Pudding</div>
          <p>Sweet potato whipped with egg and cream, then baked. Melting and gently sweet&nbsp;— <em>the warmth of a winter fire</em>.</p>
        </div>
        <div class="note">
          <div class="poem">Snow is coming tonight —<br>shall we share a cup?<small>— Bai Juyi, <i>To Liu Shijiu</i></small></div>
        </div>
      </div>
    </section>
  </article>
</template>

<!-- Print sheet: A4 landscape, two identical A5 menus side by side -->
<div class="sheet" id="sheet"><div class="cut"></div></div>

<script>
  const tpl = document.getElementById('menu-tpl');
  const sheet = document.getElementById('sheet');
  const qs = new URLSearchParams(location.search);
  const single = qs.has('single');
  // A4 landscape = 2 x A5 (148.5 x 210 mm); US Letter landscape = 2 x half-letter (5.5 x 8.5 in)
  const [w, h] = qs.get('size') === 'letter' ? [139.7, 215.9] : [148.5, 210];
  document.documentElement.style.setProperty('--mw', w + 'mm');
  document.documentElement.style.setProperty('--mh', h + 'mm');
  if (h > 210) document.documentElement.style.setProperty('--sec-gap', '5.9mm');
  if (h > 210) document.documentElement.style.setProperty('--sec-gap-en', '5.8mm');   // spend Letter's extra height on breathing room
  document.querySelector('style').append(`@page{size:${single ? w : w * 2}mm ${h}mm}`);
  if (single) { sheet.classList.add('single'); sheet.querySelector('.cut').remove(); }
  for (let i = 0; i < (single ? 1 : 2); i++) sheet.append(tpl.content.cloneNode(true));

  // Typesetting: never leave a single word alone on the last line (bind the last two words with a no-break space)
  document.querySelectorAll('.dish p, .intro p, .dish h3, .dish .real').forEach(el => {
    const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); const nodes = []; let n;
    while ((n = walk.nextNode())) if (n.data.trim() && !n.parentElement.classList.contains('zh')) nodes.push(n);
    for (let i = nodes.length - 1; i >= 0; i--) {
      const t = nodes[i].data.replace(/\s+$/, ''); const k = t.lastIndexOf(' ');
      if (k > 0) { nodes[i].data = t.slice(0, k) + '\u00a0' + t.slice(k + 1) + nodes[i].data.slice(t.length); break; }
    }
  });
</script>
